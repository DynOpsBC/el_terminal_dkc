name: Security Scan

# CodeQL push tetikleyicisi kaldırıldı:
#   - Repo özel + GitHub Advanced Security lisansı yok -> push'larda
#     "Code scanning is not enabled" hatası alıyordu.
#   - Kotlin için CodeQL otomatik build Android SDK + Gradle gerektirir;
#     build-mode=none ile saf kaynak taramasına indirildi.
# Advanced Security açılırsa "push" tetikleyicisi geri eklenebilir.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:

jobs:
  codeql:
    name: CodeQL
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Dependency Review private repolarda GitHub Advanced Security + Dependency
    # Graph gerektirir. Lisans olmadığında "Dependency review is not supported
    # on this repository" hatası alıyoruz. PR'yi engellememesi için soft-fail
    # bırakıldı. Lisans alınırsa continue-on-error kaldırılabilir.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
