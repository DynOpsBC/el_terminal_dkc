name: AL Build

on:
  push:
    paths:
      - "al/**"
      - "tools/**"
      - ".github/workflows/al-build.yml"
  pull_request:
    paths:
      - "al/**"
      - "tools/**"

jobs:
  audit:
    name: AppSource audits
    # Bash audit script'leri Ubuntu'da daha temiz koşar (CRLF/exec-bit
    # gibi Windows-bash farklılıklarına maruz kalmaz). Her script ayrı
    # adım: hangi denetim fail ederse Annotations'da net görünür.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure scripts are executable
        run: chmod +x tools/audit-*.sh
      - name: audit-permissions
        run: bash tools/audit-permissions.sh
      - name: audit-prefix
        run: bash tools/audit-prefix.sh
      - name: audit-translation-coverage
        run: bash tools/audit-translation-coverage.sh
      - name: audit-obsolete
        run: bash tools/audit-obsolete.sh

  package:
    name: AL package (placeholder)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Placeholder AL package step
        shell: pwsh
        run: |
          Write-Host "Install AL tooling or containerized compiler here."
          Write-Host "Compile .app and upload artifact in a configured Windows runner."
      - name: Upload placeholder artifact
        uses: actions/upload-artifact@v7
        with:
          name: al-build-notes
          path: al/app.json
